<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chat History Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236ea8fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 14l-3 -3h-7a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h9a1 1 0 0 1 1 1v10'/><path d='M14 15v2a1 1 0 0 1 -1 1h-7l-3 3v-10a1 1 0 0 1 1 -1h2'/></svg>">

<!-- PWA。テーマ色は起動時とテーマ切り替え時に app.js がトップバー色へ合わせ直す -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#161920">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS はホーム画面追加を apple-* メタで判定する（manifest の display は見ない） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Chats">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<!-- 「履歴に質問」モーダル（本体は ask.js が描く） -->
<link rel="stylesheet" href="/styles/ask.css">
<!-- チャット本文の描画：共通ベース → プロバイダー個別（後勝ち・data-source で切り替わる） -->
<link rel="stylesheet" href="/styles/chat.css">
<link rel="stylesheet" href="/styles/providers/chatgpt.css">
<link rel="stylesheet" href="/styles/providers/claude.css">
<link rel="stylesheet" href="/styles/providers/gemini.css">
<link rel="stylesheet" href="/styles/providers/google_ai_mode.css">
<link rel="stylesheet" href="/styles/providers/perplexity.css">
<link rel="stylesheet" href="/styles/providers/lmstudio.css">
<link rel="stylesheet" href="/styles/providers/unknown.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="btn-menu" title="一覧を開閉" aria-label="一覧を開閉" data-icon="menu-2" data-size="18"></button>
  <a class="brand" id="brand-home" href="./" title="ホームに戻る"><span class="brand-mark" data-icon="messages" data-size="19"></span><span class="brand-text">AI Chat History</span></a>

  <!-- ソース絞り込み。広い画面はピルの横並び、狭い画面は「ソース」リスト（中身は app.js が描く） -->
  <nav class="source-filter" id="source-filter" aria-label="ソースで絞り込み"></nav>

  <div class="topbar-actions">
    <button class="icon-btn" id="btn-search" title="検索（/）" aria-label="検索" aria-haspopup="dialog" data-icon="search" data-size="18"></button>
    <button class="icon-btn" id="btn-ask" title="履歴に質問（AI）" aria-label="履歴に質問" aria-haspopup="dialog" data-icon="sparkles" data-size="18"></button>
    <button class="icon-btn" id="btn-settings" title="設定" aria-label="設定" aria-haspopup="dialog" data-icon="settings" data-size="18"></button>
  </div>
</header>

<div class="layout">

  <section class="results" id="results-pane">
    <div class="results-head">
      <span id="result-count">読み込み中…</span>
      <!-- 並び順の独自ドロップダウン（中身は app.js が描く） -->
      <div class="results-sort" id="sort-slot"></div>
      <span id="result-took" class="took"></span>
    </div>
    <ol class="result-list" id="result-list"></ol>
    <div id="result-more" class="result-more"></div>
    <div
      class="results-resizer"
      id="results-resizer"
      role="separator"
      aria-label="会話一覧の幅を調整"
      aria-orientation="vertical"
      aria-controls="results-pane"
      tabindex="0"
      title="ドラッグして一覧の幅を調整"
    ></div>
  </section>

  <main class="reader" id="reader">
    <div class="empty" id="reader-empty">
      <div class="empty-mark" data-icon="messages" data-size="44"></div>
      <p>左の一覧から会話を選ぶと、ここにチャットが表示されます。</p>
      <p class="empty-keys"><kbd>/</kbd> 検索　<kbd>J</kbd>/<kbd>K</kbd> 一覧移動　<kbd>Esc</kbd> 閉じる</p>
    </div>
    <article class="conversation" id="conversation" hidden></article>
    <!-- ファイル監視による更新の通知 -->
    <div class="toast" id="toast" hidden></div>
  </main>

  <!-- 思考アクティビティ。ChatGPT（Native）の「考えました」内の
       「N件のウェブサイトを検索しました」から開く。本文（.turns）の右隣の列として
       展開し、開いている間はその分本文が狭まる（中身は app.js が描く） -->
  <aside class="activity-panel" id="activity-panel" hidden role="complementary" aria-label="アクティビティ">
    <div class="activity-head">
      <h2 id="activity-title">アクティビティ</h2>
      <button class="icon-btn" id="activity-close" title="閉じる（Esc）" aria-label="閉じる" data-icon="x" data-size="17"></button>
    </div>
    <div class="activity-body" id="activity-body"></div>
  </aside>

</div>

<!-- モバイルで一覧をオーバーレイ表示している間の背景（タップで閉じる） -->
<div class="scrim" id="scrim"></div>

<!-- モバイルでアクティビティをモーダル表示している間の背景（タップで閉じる。広い画面では出ない） -->
<div class="activity-backdrop" id="activity-backdrop" hidden></div>

<!-- 引用チップ（「Reuters +2」）のホバーカード（中身は app.js が描く） -->
<div class="cite-pop" id="cite-pop" hidden></div>

<!-- 検索はポップアップ。トップバーには虫めがねだけを置き、ここに本体を持つ -->
<div class="search-modal" id="search-modal" hidden>
  <div class="search-backdrop" id="search-backdrop"></div>
  <div class="search-dialog" role="dialog" aria-modal="true" aria-label="全会話を検索">
    <div class="search-field">
      <span class="search-icon" aria-hidden="true" data-icon="search" data-size="16"></span>
      <input id="q" type="search" placeholder="全会話を検索  （&quot;完全一致&quot; / -除外 が使えます）" autocomplete="off" spellcheck="false">
      <span class="search-hint" id="search-hint"></span>
      <select id="scope" class="search-scope" title="検索対象" aria-label="検索対象">
        <option value="all">全文</option>
        <option value="user">自分の発言</option>
        <option value="assistant">AIの回答</option>
      </select>
      <button class="icon-btn search-close" id="search-close" title="閉じる（Esc）" aria-label="閉じる" data-icon="x" data-size="17"></button>
    </div>
    <div class="search-body">
      <div class="search-label" id="search-label"></div>
      <ul class="search-list" id="search-list"></ul>
    </div>
  </div>
</div>

<!-- 設定はポップアップ。「一般」とプロバイダーごとのタブに分かれる（中身は app.js が描く） -->
<div class="settings-modal" id="settings-modal" hidden>
  <div class="settings-backdrop" id="settings-backdrop"></div>
  <div class="settings-dialog" role="dialog" aria-modal="true" aria-label="設定">
    <div class="settings-head">
      <span class="settings-mark" aria-hidden="true" data-icon="settings" data-size="17"></span>
      <h2>設定</h2>
      <button class="icon-btn" id="settings-close" title="閉じる（Esc）" aria-label="閉じる" data-icon="x" data-size="17"></button>
    </div>
    <div class="settings-body">
      <nav class="settings-tabs" id="settings-tabs" aria-label="設定カテゴリー"></nav>
      <div class="settings-pane" id="settings-pane"></div>
    </div>
  </div>
</div>

<!-- 「履歴に質問」はポップアップ。会話の状態はページを開いているあいだ保持される（描画は ask.js） -->
<div class="ask-modal" id="ask-modal" hidden>
  <div class="ask-backdrop" id="ask-backdrop"></div>
  <div class="ask-dialog" role="dialog" aria-modal="true" aria-label="履歴に質問">
    <div class="ask-head">
      <span class="ask-mark" aria-hidden="true" data-icon="sparkles" data-size="17"></span>
      <h2>履歴に質問</h2>
      <button class="icon-btn" id="ask-close" title="閉じる（Esc）" aria-label="閉じる" data-icon="x" data-size="17"></button>
    </div>
    <div class="ask-layout">
      <div class="ask-log" id="ask-log">
        <div class="ask-empty" id="ask-empty">
          <div class="mark" data-icon="sparkles" data-size="40"></div>
          <p>過去の AI チャット履歴すべてを根拠に、自然な言葉で質問できます。</p>
          <div class="hints">
            <button class="hint">最近ハマっていることは？</button>
            <button class="hint">今までに相談したプログラミングの悩みをまとめて</button>
            <button class="hint">去年よく調べていた話題は何？</button>
          </div>
        </div>
      </div>
      <div class="ask-form-wrap">
        <label class="deep-toggle" title="質問をサブ質問に分解し、検索と検証を繰り返す調査モード（数分〜十数分かかります）">
          <input type="checkbox" id="deep-mode"><span data-icon="microscope" data-size="15"></span> 詳しく調査
        </label>
        <form class="ask-form" id="ask-form">
          <textarea id="ask-input" rows="1" placeholder="履歴について質問…  (Enter で送信 / Shift+Enter で改行)"></textarea>
          <button type="submit" id="ask-send">送信</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 文章作成ドキュメント（:::writing）の全画面表示。開くと本文中の
     .writing-card がこの中へ移動し、閉じると元の位置へ戻る（app.js が動かす） -->
<div class="writing-modal" id="writing-modal" hidden>
  <div class="writing-backdrop" id="writing-backdrop"></div>
  <div class="writing-dialog" role="dialog" aria-modal="true" aria-label="ドキュメント"></div>
</div>

<!-- 添付画像のフルサイズプレビュー（サムネイルのタップで開く。中身は app.js が入れる） -->
<div class="imgview-modal" id="imgview-modal" hidden>
  <div class="imgview-backdrop" id="imgview-backdrop"></div>
  <img class="imgview-img" id="imgview-img" alt="" role="dialog" aria-modal="true" aria-label="画像プレビュー">
  <button class="icon-btn imgview-close" id="imgview-close" title="閉じる（Esc）" aria-label="閉じる" data-icon="x" data-size="20"></button>
</div>

<script src="/vendor/markdown-it/markdown-it.min.js"></script>
<!-- コードハイライト: CodeMirror (lezer)。import map で node_modules の ESM を解決する -->
<script type="importmap">
{
  "imports": {
    "@lezer/common": "/vendor/nm/@lezer/common/dist/index.js",
    "@lezer/highlight": "/vendor/nm/@lezer/highlight/dist/index.js",
    "@lezer/lr": "/vendor/nm/@lezer/lr/dist/index.js",
    "@lezer/javascript": "/vendor/nm/@lezer/javascript/dist/index.js",
    "@lezer/css": "/vendor/nm/@lezer/css/dist/index.js",
    "@lezer/html": "/vendor/nm/@lezer/html/dist/index.js",
    "@lezer/xml": "/vendor/nm/@lezer/xml/dist/index.js",
    "@lezer/python": "/vendor/nm/@lezer/python/dist/index.js",
    "@lezer/json": "/vendor/nm/@lezer/json/dist/index.js",
    "@lezer/java": "/vendor/nm/@lezer/java/dist/index.js",
    "@lezer/cpp": "/vendor/nm/@lezer/cpp/dist/index.js",
    "@lezer/rust": "/vendor/nm/@lezer/rust/dist/index.js",
    "@lezer/php": "/vendor/nm/@lezer/php/dist/index.js",
    "@lezer/yaml": "/vendor/nm/@lezer/yaml/dist/index.js",
    "@lezer/markdown": "/vendor/nm/@lezer/markdown/dist/index.js",
    "@codemirror/language": "/vendor/nm/@codemirror/language/dist/index.js",
    "@codemirror/state": "/vendor/nm/@codemirror/state/dist/index.js",
    "@codemirror/view": "/vendor/nm/@codemirror/view/dist/index.js",
    "@codemirror/legacy-modes/mode/": "/vendor/nm/@codemirror/legacy-modes/mode/",
    "style-mod": "/vendor/nm/style-mod/src/style-mod.js",
    "w3c-keyname": "/vendor/nm/w3c-keyname/index.js",
    "crelt": "/vendor/nm/crelt/index.js",
    "@marijn/find-cluster-break": "/vendor/nm/@marijn/find-cluster-break/src/index.js"
  }
}
</script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
<!-- module として読み、app.js とトップレベルの識別子（el, md など）が衝突しないようにする -->
<script type="module" src="/ask.js"></script>
<script>
// PWA: Service Worker の登録。LAN の IP（http://192.168.x.x）で開いた場合は
// secure context でないため navigator.serviceWorker が無く、静かにスキップされる
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
